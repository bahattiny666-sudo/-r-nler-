<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yalçın Toplu Tüketim - Ürün Kataloğu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f7f8fa; color: #333; padding-bottom: 50px; }
        .başlık { background: #ffffff; padding: 15px; text-align: center; font-size: 18px; font-weight: bold; border-bottom: 1px solid #eee; }
        .ürün listesi { padding: 15px; display: flex; flex-direction: column; gap: 15px; }
        .ürün öğesi { background: #ffffff; padding: 15px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .ürün öğesi img { width: 100%; border-radius: 8px; margin-bottom: 10px; }
        .ürün bilgisi h4 { font-size: 16px; margin-bottom: 5px; color: #111; }
        .ürün bilgisi p { font-size: 13px; color: #666; margin-bottom: 10px; }
        .ürün-fiyatı { font-size: 15px; font-weight: bold; color: #10b981; }
    </style>
</head>
<body>

    <div class="başlık">Yalçın Toplu Tüketim - Ürün Kataloğu</div>

    <div class="ürün listesi">
        <!-- permatik -->
        <div class="ürün öğesi">
            <img src="permatik.jpg" alt="Arko Gillette Permatik Banyo Tıraş Bıçağı 48'li">
            <div class="ürün bilgisi">
                <h4>Arko Gillette Permatik Banyo Tıraş Bıçağı 48'li</h4>
                <p>48'li Paket / Kolay Fiyat</p>
            </div>
            <div class="ürün-fiyatı">Fiyat Sorunuz</div>
        </div>
    </div>

</body>
</html>
