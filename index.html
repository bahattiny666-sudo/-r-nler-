<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yalçın Toplu Tüketim | Ürün Kataloğu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #f59e0b;
      --whatsapp: #25D366;
      --whatsapp-dark: #1ebe5d;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding-bottom: 90px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: var(--text);
    }
    .brand-logo {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 18px;
      letter-spacing: -0.5px;
      flex-shrink: 0;
    }
    .brand-text strong {
      display: block;
      font-size: 17px;
      font-weight: 800;
      line-height: 1.2;
    }
    .brand-text strong em {
      font-style: normal;
      color: var(--primary);
    }
    .brand-text span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-header {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }
    .btn-phone {
      background: #f1f5f9;
      color: var(--text);
    }
    .btn-phone:hover { background: #e2e8f0; }
    .btn-wa-top {
      background: var(--whatsapp);
      color: #fff;
    }
    .btn-wa-top:hover { background: var(--whatsapp-dark); }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Hero Banner */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #fff;
      border-radius: 20px;
      padding: 28px 24px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }
    .hero-badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.12);
      color: #5eead4;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 99px;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .hero h1 {
      font-size: 24px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 8px;
    }
    .hero h1 span { color: #5eead4; }
    .hero p {
      font-size: 14px;
      color: #cbd5e1;
      max-width: 540px;
      margin-bottom: 16px;
    }
    .hero-stats {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 13px;
      color: #94a3b8;
    }
    .hero-stats strong { color: #fff; font-size: 15px; }

    /* Search Bar */
    .search-box {
      position: relative;
      margin-bottom: 24px;
    }
    .search-box input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--card);
      font-size: 15px;
      font-family: inherit;
      color: var(--text);
      box-shadow: var(--shadow);
      outline: none;
      transition: border-color 0.2s;
    }
    .search-box input:focus { border-color: var(--primary); }
    .search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 18px;
    }

    /* Section Titles */
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .section-head h2 {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-head span {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    /* Campaign Horizontal Scroll */
    .campaign-grid {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 28px;
      scrollbar-width: none;
    }
    .campaign-grid::-webkit-scrollbar { display: none; }
    .campaign-card {
      min-width: 220px;
      max-width: 220px;
      background: var(--card);
      border: 1px solid #fde68a;
      border-radius: var(--radius);
      padding: 12px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .campaign-tag {
      background: #fef3c7;
      color: #b45309;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      align-self: flex-start;
      margin-bottom: 8px;
    }

    /* Category Pills */
    .category-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 12px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .cat-btn {
      padding: 9px 16px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.2s;
    }
    .cat-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Product Grid */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    @media (min-width: 768px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }

    .product-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }
    .product-img-wrap {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .product-cat-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.72);
      color: #fff;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }
    .product-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      justify-content: space-between;
    }
    .product-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-desc {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: auto;
    }
    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--primary);
    }
    .btn-add {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }
    .btn-add:hover { background: var(--primary-dark); }

    /* Floating Cart Bar */
    .cart-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      max-width: 600px;
      margin: 0 auto;
      background: #0f172a;
      color: #fff;
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.3);
      z-index: 50;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .cart-bar.hidden { display: none; }
    .cart-bar-left { display: flex; align-items: center; gap: 12px; }
    .cart-count {
      background: var(--whatsapp);
      color: #fff;
      font-weight: 800;
      font-size: 13px;
      padding: 4px 10px;
      border-radius: 8px;
    }
    .cart-bar-right { font-weight: 700; font-size: 14px; color: #5eead4; }

    /* Modal / Cart Drawer */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 60;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .modal-backdrop { align-items: center; }
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--card);
      width: 100%;
      max-width: 500px;
      max-height: 88vh;
      border-radius: 22px 22px 0 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    @media (min-width: 640px) {
      .modal-box { border-radius: 22px; }
    }
    .modal-header {
      display: flex;
      align-items: center;
